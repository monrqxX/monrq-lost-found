name = "monrq-lost-found"
main = "./server/worker.js"
compatibility_date = "2026-10-17"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[durable_objects.bindings]]
name = "MONGO_API"
class_name = "MongoApi"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MongoApi"]

[vars]
MONGODB_DB = "monrq"
